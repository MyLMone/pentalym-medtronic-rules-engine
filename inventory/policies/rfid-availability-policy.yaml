id: rfid-availability-policy
version: 1.0.0
status: draft

availabilityRules:
  - name: Available Now
    condition: product_is_rfid_enabled_and_stock_available
    outputStatus: Available

  - name: Low Stock
    condition: current_stock_below_par
    outputStatus: Low Stock

  - name: Expiring Soon
    condition: expiry_within_30_days
    outputStatus: Expiring Soon

  - name: Not RFID Enabled
    condition: product_not_tracked_by_rfid
    outputStatus: Not RFID Enabled
